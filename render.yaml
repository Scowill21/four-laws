# Render Blueprint — Four Laws (buildless static site: index.html + glossary.html).
#
# Deploy: push this repo to GitHub, then Render Dashboard → New → Blueprint → pick
# the repo (Render reads this file and provisions the service). Or by hand via
# New → Static Site with an empty Build Command and Publish Directory ".".
services:
  - type: web
    name: four-laws
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    # Root "/" 404s on Render when publishing the repo root ("no-server" routing
    # quirk) even though /index.html serves — this rewrite makes "/" (and any
    # unknown path) land on the site. Real files are always served first.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
