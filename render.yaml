# Render Blueprint — Four Laws (buildless static site: index.html + glossary.html).
#
# Deploy: push this repo to GitHub, then Render Dashboard → New → Blueprint → pick
# the repo (Render reads this file and provisions the service). Or by hand via
# New → Static Site with an empty Build Command and Publish Directory ".".
services:
  - type: web
    name: four-laws
    runtime: static
    buildCommand: ""
    staticPublishPath: .
